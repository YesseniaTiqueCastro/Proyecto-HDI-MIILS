<h2>Consulta de Inspección</h2>

<input #idInput type="text" placeholder="ID inspección" />
<button (click)="consultar(idInput.value)">
  Consultar inspección
</button>

<p *ngIf="loading">Consultando...</p>

<p *ngIf="error" style="color:red">
  {{ error }}
</p>

<pre *ngIf="response">
{{ response | json }}
</pre>
